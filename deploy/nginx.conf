# /etc/nginx/sites-available/portfolio. certbot --nginx adds the 443 block.
server {
    listen 80;
    listen [::]:80;
    server_name hirbodaflaki.com www.hirbodaflaki.com;

    client_max_body_size 64k;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

    # static files straight from disk: Node only handles pages and the API
    location /_next/static/ {
        alias /opt/portfolio/current/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~ ^/(assets|audio)/ {
        root /opt/portfolio/current/public;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
